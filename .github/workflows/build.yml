name: Build LudoMax

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check Privacy Policy / Terms are filled in
        env:
          HAS_KEYSTORE: ${{ secrets.LUDOMAX_KEYSTORE_BASE64 != '' }}
        run: |
          if grep -rq "{{" app/src/main/assets docs; then
            echo "::warning::Privacy Policy / Terms still contain {{placeholders}}. Run: ./scripts/set_contact.sh \"Your Name\" \"you@email.com\" \"India\""
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "::error::Fill the placeholders before building a signed Play Store release."
              exit 1
            fi
          fi

      # Optional: if you added the signing secrets, a signed release is built.
      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.LUDOMAX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ludomax.jks"
            echo "LUDOMAX_KEYSTORE_PATH=$RUNNER_TEMP/ludomax.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded."
          else
            echo "No keystore secret set - release build will be unsigned."
          fi

      - name: Build debug APK, release APK and release AAB
        env:
          LUDOMAX_KEYSTORE_PASSWORD: ${{ secrets.LUDOMAX_KEYSTORE_PASSWORD }}
          LUDOMAX_KEY_ALIAS: ${{ secrets.LUDOMAX_KEY_ALIAS }}
          LUDOMAX_KEY_PASSWORD: ${{ secrets.LUDOMAX_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK (install & test on phone)
        uses: actions/upload-artifact@v4
        with:
          name: LudoMax-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoMax-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: LudoMax-release-aab
          path: app/build/outputs/bundle/release/*.aab
